<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用語集 | 顔出しなしYouTube攻略ロードマップ</title>
<script src="glossary.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; background: #fafaf8; color: #1a1a18; line-height: 1.7; }
.wrap { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
.page-title { font-size: 22px; font-weight: 500; margin-bottom: 0.25rem; }
.page-sub { font-size: 14px; color: #888; margin-bottom: 2rem; }
.search-wrap { position: relative; margin-bottom: 1.5rem; }
.search-input { width: 100%; font-size: 15px; padding: 10px 16px 10px 40px; border-radius: 10px; border: 1px solid #ddd; background: #fff; color: #1a1a18; }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #aaa; font-size: 16px; }
.term-card { background: #fff; border: 1px solid #ebebeb; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 0.75rem; }
.term-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 0.5rem; }
.term-name { font-size: 17px; font-weight: 500; }
.term-reading { font-size: 12px; color: #aaa; }
.term-simple { font-size: 14px; color: #444; font-weight: 500; margin-bottom: 0.4rem; }
.term-detail { font-size: 13px; color: #777; line-height: 1.7; }
.back-link { display: inline-block; font-size: 13px; color: #888; margin-bottom: 1.5rem; text-decoration: none; }
.back-link:hover { color: #333; }
.no-result { font-size: 14px; color: #aaa; text-align: center; padding: 2rem; }
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="back-link">← ロードマップツールに戻る</a>
  <p class="page-title">用語集</p>
  <p class="page-sub">わからない言葉が出てきたときに確認してください。随時追加していきます。</p>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" type="text" placeholder="用語を検索..." oninput="filterTerms(this.value)" id="searchInput">
  </div>
  <div id="termList"></div>
</div>
<script>
function renderTerms(filter) {
  const list = document.getElementById('termList');
  const terms = Object.entries(GLOSSARY).filter(([k,v]) => {
    if(!filter) return true;
    return k.includes(filter) || v.reading.includes(filter) || v.simple.includes(filter) || v.detail.includes(filter);
  });
  if(terms.length === 0) {
    list.innerHTML = '<p class="no-result">「' + filter + '」に一致する用語が見つかりませんでした。</p>';
    return;
  }
  list.innerHTML = terms.map(([k,v]) => `
    <div class="term-card" id="term-${k}">
      <div class="term-head">
        <span class="term-name">${k}</span>
        <span class="term-reading">（${v.reading}）</span>
      </div>
      <p class="term-simple">→ ${v.simple}</p>
      <p class="term-detail">${v.detail}</p>
    </div>
  `).join('');
}
function filterTerms(val) { renderTerms(val.trim()); }
renderTerms('');
const hash = location.hash.replace('#','');
if(hash) { const el = document.getElementById('term-'+decodeURIComponent(hash)); if(el) el.scrollIntoView({behavior:'smooth'}); }
</script>
</body>
</html>
